name: Verify INNOVIA
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: innovia_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/innovia_test
      TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/innovia_test
      APP_SIGNING_SECRET: ci-only-signing-secret-at-least-32-characters
      ADMIN_ORIGIN: http://localhost:5174
      STOREFRONT_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: node scripts/migrate-test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: node --import tsx scripts/verify-redis.mjs
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
      - run: npm test
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
        working-directory: apps/mobile
      - run: npx tsc --noEmit
        working-directory: apps/mobile
      - run: npx expo export --platform android --platform ios --output-dir dist-ci
        working-directory: apps/mobile
